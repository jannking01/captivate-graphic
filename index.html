<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captivate | Create Your Graphic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
    @font-face {
    font-family: 'Modena Script';
    src: url('ModenaScript-Regular.ttf') format('truetype');
    font-display: swap;
  }
  :root {
    --maroon: #84253a;
    --maroon-dark: #5e1828;
    --blue: #b8dce6;
    --cream: #fbf7f4;
    --ink: #2a1a1f;
    --muted: #7a6269;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Montserrat', system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% 0%, #f4dfe4 0%, transparent 40%),
      radial-gradient(circle at 90% 100%, #d7eef4 0%, transparent 40%),
      var(--cream);
    display: flex; flex-direction: column; align-items: center;
    padding: 36px 16px 48px;
  }

  header { text-align: center; margin-bottom: 22px; }
  .eyebrow {
    font-size: .75rem; letter-spacing: .3em; text-transform: uppercase; color: var(--muted);
  }
  h1 {
    margin: 4px 0 0;
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(3rem, 9vw, 4.8rem);
    letter-spacing: .04em;
    line-height: .95;
    color: var(--maroon);
  }
  .script {
    font-family: 'Modena Script', cursive;
    color: var(--maroon);
    font-size: 1.9rem;
    margin-top: -6px;
  }

  /* Steps */
  .steps {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    margin: 18px 0 24px; font-size: .82rem; color: var(--muted);
  }
  .steps span {
    padding: 6px 14px; border-radius: 999px; background: #fff;
    border: 1px solid #ecd9de; transition: all .3s;
  }
  .steps span.on { background: var(--maroon); color: #fff; border-color: var(--maroon); }

  /* Preview frame */
  .frame {
    position: relative;
    width: min(92vw, 540px);
    padding: 10px;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--maroon), var(--maroon-dark) 60%, #d9a3ae);
    box-shadow: 0 24px 50px -18px rgba(94,24,40,.55), 0 0 0 1px rgba(255,255,255,.4) inset;
  }
  #wrap {
    position: relative;
    width: 100%; aspect-ratio: 1 / 1;
    border-radius: 14px; overflow: hidden; background: #ddd;
  }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas.grabbing { cursor: grabbing; }

  /* Empty-state hint sits over the photo box on the template */
  #hint {
    position: absolute;
    left: 4.3%; top: 55.9%; width: 40.4%; height: 40.4%;
    border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: rgba(132,37,58,.0);
    color: #fff; text-align: center; cursor: pointer;
    transition: background .3s;
  }
  #hint:hover { background: rgba(132,37,58,.15); }
  #hint .ring {
    width: 74px; height: 74px; border-radius: 50%;
    border: 2px dashed rgba(255,255,255,.9);
    display: grid; place-items: center; font-size: 2rem;
    animation: pulse 2.2s ease-in-out infinite;
  }
  #hint strong { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 1.7rem; letter-spacing: .06em; }
  #hint small { font-size: .8rem; opacity: .9; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.08); opacity: .7; }
  }
  .hidden { display: none !important; }

  /* Controls card */
  .card {
    margin-top: 24px; width: min(92vw, 540px);
    background: #fff; border-radius: 18px; padding: 22px;
    box-shadow: 0 10px 30px -14px rgba(42,26,31,.25);
    display: flex; flex-direction: column; gap: 16px;
  }
  .upload-btn, .download-btn {
    display: block; width: 100%; text-align: center; border: 0; cursor: pointer;
    font-family: 'Bebas Neue', sans-serif; font-size: 1.35rem; letter-spacing: .08em;
    padding: 14px 18px; border-radius: 12px; transition: transform .15s, box-shadow .2s, opacity .2s;
  }
  .upload-btn {
    background: var(--blue); color: var(--maroon-dark);
  }
  .upload-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px -8px rgba(94,24,40,.4); }
  .download-btn {
    background: linear-gradient(120deg, var(--maroon) 0%, #a83a52 50%, var(--maroon) 100%);
    background-size: 200% 100%;
    color: #fff;
  }
  .download-btn:not(:disabled):hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px -10px rgba(132,37,58,.8);
    animation: shimmer 1.2s linear infinite;
  }
  .download-btn:disabled { opacity: .35; cursor: default; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  #file { display: none; }

  .zoom-row { display: flex; align-items: center; gap: 12px; font-size: .85rem; color: var(--muted); }
  .zoom-row label { white-space: nowrap; font-weight: 600; color: var(--ink); letter-spacing: .04em; }
  input[type=range] { flex: 1; accent-color: var(--maroon); }
  input[type=range]:disabled { opacity: .4; }

  .msg { font-size: .88rem; min-height: 1.3em; text-align: center; color: var(--muted); }
  .msg.err { color: #b00020; }
  .msg.warn { color: #8a5a00; }

  footer { margin-top: 26px; font-size: .75rem; color: var(--muted); text-align: center; max-width: 480px; }
  .footer-line { font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; letter-spacing: .06em;
                 color: var(--maroon); display: block; margin-bottom: 4px; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Speaking Event</div>
  <h1>Captivate</h1>
  <div class="script">Create your graphic</div>
</header>

<div class="steps">
  <span id="s1" class="on">1 &middot; Add your photo</span>
  <span id="s2">2 &middot; Position it</span>
  <span id="s3">3 &middot; Download</span>
</div>

<div class="frame">
  <div id="wrap">
    <canvas id="c" width="2000" height="2000"></canvas>
    <div id="hint" role="button" tabindex="0" aria-label="Add your headshot">
      <div class="ring">+</div>
    </div>
  </div>
</div>

<div class="card">
  <input type="file" id="file" accept="image/jpeg,image/png,image/webp">
  <button class="upload-btn" id="pick">Choose Your Headshot</button>
  <div class="zoom-row">
    <label for="zoom">ZOOM</label>
    <input type="range" id="zoom" min="1" max="3" step="0.01" value="1" disabled>
  </div>
  <div class="msg" id="msg">Your photo stays on your device. Drag it to center your face.</div>
  <button class="download-btn" id="dl" disabled>Download My Graphic</button>
</div>

<footer>
  <span class="footer-line">Turn your message into a 6-figure sales machine</span>
  Your photo is never uploaded. It is only used to create your graphic here.
</footer>

<script>
// Placeholder box measured from the template (2000 x 2000 px)
const BOX = { x: 86, y: 1118, w: 808, h: 808 };  // circle placeholder (bounding square)
const SIZE = 2000;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const fileInput = document.getElementById('file');
const pickBtn = document.getElementById('pick');
const hint = document.getElementById('hint');
const zoomInput = document.getElementById('zoom');
const dlBtn = document.getElementById('dl');
const msg = document.getElementById('msg');
const steps = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3')];

const tpl = new Image();
let photo = null;
let zoom = 1, offX = 0, offY = 0;
let ready = false;

tpl.onload = () => { ready = true; draw(); };
tpl.onerror = () => setMsg('Template image not found. Keep captivate-template.png in the same folder as this page.', 'err');
tpl.src = 'captivate-template.png';

function circlePath() {
  const cx = BOX.x + BOX.w / 2, cy = BOX.y + BOX.h / 2, rad = BOX.w / 2;
  ctx.beginPath();
  ctx.arc(cx, cy, rad, 0, Math.PI * 2);
  ctx.closePath();
}

function layout() {
  const base = Math.max(BOX.w / photo.naturalWidth, BOX.h / photo.naturalHeight);
  const s = base * zoom;
  const dw = photo.naturalWidth * s, dh = photo.naturalHeight * s;
  const maxX = Math.max(0, (dw - BOX.w) / 2), maxY = Math.max(0, (dh - BOX.h) / 2);
  offX = Math.min(maxX, Math.max(-maxX, offX));
  offY = Math.min(maxY, Math.max(-maxY, offY));
  const cx = BOX.x + BOX.w / 2 + offX, cy = BOX.y + BOX.h / 2 + offY;
  return { x: cx - dw / 2, y: cy - dh / 2, w: dw, h: dh };
}

function draw() {
  if (!ready) return;
  ctx.clearRect(0, 0, SIZE, SIZE);
  ctx.drawImage(tpl, 0, 0, SIZE, SIZE);
  if (!photo) return;
  const p = layout();
  ctx.save();
  circlePath();
  ctx.clip();
  ctx.fillStyle = '#84253a';
  ctx.fillRect(BOX.x, BOX.y, BOX.w, BOX.h);
  ctx.drawImage(photo, p.x, p.y, p.w, p.h);
  ctx.restore();
}

function setMsg(text, cls) {
  msg.textContent = text;
  msg.className = 'msg' + (cls ? ' ' + cls : '');
}

function setStep(n) {
  steps.forEach((el, i) => el.classList.toggle('on', i <= n));
}

function openPicker() { fileInput.click(); }
pickBtn.addEventListener('click', openPicker);
hint.addEventListener('click', openPicker);
hint.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openPicker(); });

fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (!f) return;
  if (!/^image\/(jpeg|png|webp)$/.test(f.type)) {
    setMsg('Please choose a JPG, PNG, or WEBP photo.', 'err');
    return;
  }
  if (f.size > 15 * 1024 * 1024) {
    setMsg('That file is over 15 MB. Please choose a smaller photo.', 'err');
    return;
  }
  const img = new Image();
  img.onload = () => {
    const shortSide = Math.min(img.naturalWidth, img.naturalHeight);
    if (shortSide < 800) {
      setMsg('Your photo is small and may look blurry. A photo at least 800 px on its shortest side works best.', 'warn');
    } else {
      setMsg('Drag to position your photo, then download.');
    }
    photo = img;
    zoom = 1; offX = 0; offY = 0;
    zoomInput.value = 1;
    zoomInput.disabled = false;
    dlBtn.disabled = false;
    hint.classList.add('hidden');
    pickBtn.textContent = 'Choose a Different Photo';
    setStep(1);
    draw();
  };
  img.onerror = () => setMsg('Could not read that image. Please try another file.', 'err');
  img.src = URL.createObjectURL(f);
});

zoomInput.addEventListener('input', () => {
  zoom = parseFloat(zoomInput.value);
  draw();
});

let dragging = false, lastX = 0, lastY = 0;
function toCanvas(e) {
  const rect = canvas.getBoundingClientRect();
  const k = SIZE / rect.width;
  return { x: (e.clientX - rect.left) * k, y: (e.clientY - rect.top) * k };
}
canvas.addEventListener('pointerdown', e => {
  if (!photo) return;
  dragging = true;
  const p = toCanvas(e);
  lastX = p.x; lastY = p.y;
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add('grabbing');
  setStep(2);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const p = toCanvas(e);
  offX += p.x - lastX;
  offY += p.y - lastY;
  lastX = p.x; lastY = p.y;
  draw();
});
const endDrag = () => { dragging = false; canvas.classList.remove('grabbing'); };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

dlBtn.addEventListener('click', () => {
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'captivate-graphic.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setStep(2);
    setMsg('Your graphic is downloaded. Share it and show us your Captivate pride!');
  }, 'image/png');
});
</script>
</body>
</html>
